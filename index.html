<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <!-- Racha actual -->
    <section class="tarjeta racha">
      <span class="racha-icono" aria-hidden="true">🔥</span>
      <p class="racha-numero" id="racha-numero">0</p>
      <p class="racha-texto" id="racha-texto">días seguidos</p>
    </section>

    <!-- Formulario para registrar una sesión -->
    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="Ej.: Funciones en JavaScript" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" step="1" placeholder="Ej.: 30" required>

        <p class="error" id="error"></p>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <!-- Lista de sesiones -->
    <section class="tarjeta">
      <h2>Sesiones</h2>
      <p class="vacio" id="vacio">Todavía no has registrado ninguna sesión.</p>
      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
